name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  # Each step runs a script of scripts/, which scripts/ci.sh runs together
  # locally. CI only provides what the scripts need.
  #
  # Every C++ source as .clang-format has it, with clang-format 22.1.4.
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: scripts/format.sh
  # The official GCC image, pinned by digest: the same one Scrydantic's CI
  # builds in. GitHub's runners have no GCC 16 of their own.
  test:
    name: test (${{ matrix.preset }})
    strategy:
      fail-fast: false
      matrix:
        preset: [release, asan, tsan]
    runs-on: ubuntu-24.04
    container:
      image: gcc:16.2.0@sha256:07280eb2e744f1b7a2d8d4a3894c089ea07266c109758afc388a634bd098e4eb
    steps:
      - uses: actions/checkout@v7
      - name: Install the build tools
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update -o Acquire::Retries=5
          apt-get install -y --no-install-recommends -o Acquire::Retries=5 \
            cmake ninja-build python3-venv
      - run: scripts/build.sh ${{ matrix.preset }}
      # The example server, driven by the official Python client over stdio
      # and HTTP, in both protocol eras.
      - name: Interoperate with the Python SDK
        run: scripts/interop.sh ${{ matrix.preset }}
      # The installed package, used by a project of its own.
      - name: Install and use the package
        if: matrix.preset == 'release'
        run: scripts/install-check.sh release
      # The official conformance suite against the fixture server, in both
      # revisions, with a baseline of what the library does not do yet. It
      # needs a newer Node than Debian's.
      - name: Install Node
        if: matrix.preset == 'release'
        env:
          NODE_VERSION: v24.22.3
        run: |
          archive=node-$NODE_VERSION-linux-x64.tar.xz
          curl -fsSLO "https://nodejs.org/dist/$NODE_VERSION/$archive"
          curl -fsSL "https://nodejs.org/dist/$NODE_VERSION/SHASUMS256.txt" |
            grep " $archive\$" | sha256sum -c -
          tar -xJf "$archive" -C /usr/local --strip-components=1
          node --version
      - name: Conformance
        if: matrix.preset == 'release'
        run: scripts/conformance.sh release
      - name: Keep the conformance results
        if: always() && matrix.preset == 'release'
        uses: actions/upload-artifact@v7
        with:
          name: conformance-results
          path: build/conformance-results
          if-no-files-found: ignore
